# Weekly encrypted backup of the Namaz Board database.
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_SECRET_KEY, BACKUP_PASSPHRASE
# Each backup is kept for 90 days under Actions → "Weekly backup" → the run → Artifacts.
# It's encrypted, so only someone with BACKUP_PASSPHRASE can open it.
name: Weekly backup
on:
  schedule:
    - cron: "23 2 * * 0"   # Sundays 02:23 UTC
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Export tables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/backup.mjs
      - name: Compress and encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE" || { echo "Missing BACKUP_PASSPHRASE secret"; exit 1; }
          name="namaz-backup-$(date -u +%Y-%m-%d)"
          gzip -9 backup.json
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE -in backup.json.gz -out "$name.json.gz.enc"
          rm backup.json.gz
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.json.gz.enc
          retention-days: 90
